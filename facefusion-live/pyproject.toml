[project]
name = "facefusion-live"
version = "0.1.0"
description = "Local-first real-time face swapping for images, videos and webcams"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.9", "onnx>=1.16", "onnxruntime>=1.18", "PySide6>=6.6", "psutil>=5.9",
                "pygrabber>=0.2; sys_platform == 'win32'"]

[project.optional-dependencies]
virtualcam = ["pyvirtualcam>=0.11"]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]
directml = ["onnxruntime-directml>=1.18"]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
facefusion-live = "facefusion_live.__main__:main"

[tool.setuptools.packages.find]
include = ["facefusion_live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
